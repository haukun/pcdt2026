<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>p5.js PreviewViewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- 作品を実行する iframe（クロスフェード用に2枚） -->
    <div id="frames">
      <iframe id="slot-a" class="sketch-frame" sandbox="allow-scripts" scrolling="no"></iframe>
      <iframe id="slot-b" class="sketch-frame" sandbox="allow-scripts" scrolling="no"></iframe>
    </div>

    <!-- Twitter風カードオーバーレイ -->
    <div id="overlay">
      <!-- タイトルバッジ（カードの上） -->
      <div id="counter"></div>

      <!-- バッジ類（タイトルの下・カードの外） -->
      <div id="tweet-footer">
        <span id="overlay-version" class="badge badge-soft"></span>
        <span id="overlay-tags"></span>
      </div>

      <div id="tweet">
        <div id="tweet-header">
          <img id="tweet-avatar" src="../resources/guu.png" alt="">
          <div id="tweet-names">
            <div id="tweet-name">
              はぅ君
              <svg id="tweet-verified" viewBox="0 0 24 24" aria-label="認証済み">
                <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>
              </svg>
            </div>
            <div id="tweet-handle">@Hau_kun</div>
          </div>
          <div id="tweet-menu">···</div>
        </div>

        <div id="tweet-body"><span id="tweet-text"></span></div>

        <div id="tweet-charline"><span id="overlay-chars"></span></div>

        <div id="tweet-media">
          <img id="tweet-image" alt="">
        </div>

        <div id="tweet-date"></div>
      </div>
    </div>

    <!-- 進捗バー -->
    <div id="progress"><div id="progress-fill"></div></div>

    <!-- 起動失敗など -->
    <div id="notice" hidden></div>
  </div>

  <!-- 自動生成マニフェスト（window.PREVIEW_MANIFEST） -->
  <script src="manifest.js"></script>
  <script src="player.js"></script>
</body>
</html>
